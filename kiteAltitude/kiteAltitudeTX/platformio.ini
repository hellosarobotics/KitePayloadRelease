; PlatformIO project file for kiteAltitudeTX (nodo aquilone)
; Board fisica: ESP32-C3 "Super Mini" (clone generico, stesso chip/flash della devkitm-1)

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
; upload_port/monitor_port: lasciati auto-rilevati da PlatformIO.
; Se l'auto-rilevamento fallisce, scommentare e impostare la porta COM giusta (Gestione dispositivi > Porte COM):
; upload_port = COM5
; monitor_port = COM5

lib_deps =
    jgromes/RadioLib@^7.7.1
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit Unified Sensor@^1.1.15
